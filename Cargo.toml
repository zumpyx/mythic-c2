[package]
name = "mythic-c2"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Zumpyx <zumpyx@qq.com>"]
description = "Mythic C2 4.0 plaintext agent protocol structures and encoding (no encryption)"
repository = "https://github.com/zumpyx/mythic-c2"
documentation = "https://docs.rs/mythic-c2"
readme = "README.md"
keywords = ["mythic", "c2", "red-team", "agent", "protocol"]
categories = ["network-programming", "development-tools"]

[lib]
name = "mythic"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }
obfstr = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
