[package]
name = "mythic-c2"
version = "4.0.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Zumpyx <zumpyx@qq.com>"]
description = "Mythic C2 4.0 plaintext agent protocol structures (no_std + alloc)"
repository = "https://github.com/zumpyx/mythic-c2"
documentation = "https://docs.rs/mythic-c2"
readme = "README.md"
keywords = ["mythic", "c2", "red-team", "agent", "protocol", "no-std"]
categories = ["network-programming", "no-std", "development-tools"]

[lib]
name = "mythic"
path = "src/lib.rs"

[features]
default = ["json"]
json = ["dep:serde", "dep:serde_json"]

[dependencies]
obfstr = { version = "0.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
