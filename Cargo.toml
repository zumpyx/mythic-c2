[package]
name = "mythic-c2"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Zumpyx <zumpyx@qq.com>"]
description = "Mythic C2 agent library — message encoding, AES-256-CBC-HMAC crypto, and transport abstraction for the full agent lifecycle"
repository = "https://github.com/zumpyx/mythic-c2"
documentation = "https://docs.rs/mythic-c2"
readme = "README.md"
keywords = ["mythic", "c2", "red-team", "agent", "protocol"]
categories = ["network-programming", "cryptography", "development-tools"]

[lib]
name = "mythic"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false, features = ["alloc"] }
cipher = { version = "0.4", default-features = false, features = ["alloc", "block-padding"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
